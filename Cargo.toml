[package]
name = "tauri-plugin-camera-kessdev"
version = "0.1.1-beta.2"
authors = [ "kess" ]
description = "Camera plugin for Tauri v2: photo capture, video recording and preview on Android, iOS and desktop."
license = "MIT"
repository = "https://github.com/kessdev/tauri-plugin-camera"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "/.changes", "/.github"]
links = "tauri-plugin-camera-kessdev"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
