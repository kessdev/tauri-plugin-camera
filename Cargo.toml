[package]
name = "tauri-plugin-camera"
version = "0.1.0"
authors = [ "You" ]
description = "Camera plugin for Tauri v2: photo capture, video recording and preview on Android, iOS and desktop."
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-camera"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
