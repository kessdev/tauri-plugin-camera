[package]
name = "tauri-plugin-camera-kessdev"
version = "0.1.1-beta.1"
authors = [ "kess" ]
description = "Camera plugin for Tauri v2: photo capture, video recording and preview on Android, iOS and desktop."
license = "MIT"
repository = "https://github.com/kessdev/tauri-plugin-camera"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "/.changes", "/.github"]
links = "tauri-plugin-camera-kessdev"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
