[package]
name = "tauri-plugin-camera-kessdev"
version = "0.2.0-beta.2"
authors = [ "kess" ]
description = "Camera plugin for Tauri v2: photo capture, video recording and preview on Android, iOS and desktop."
license = "MIT"
repository = "https://github.com/kessdev/tauri-plugin-camera"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules", "/.changes", "/.github"]
links = "tauri-plugin-camera-kessdev"

[features]
default = []
# Native desktop camera backend (capture -> preview frames + native encoder).
# Off by default to avoid requiring the platform dev libraries (e.g. GStreamer
# on Linux) for every build.
native-desktop = ["dep:gstreamer", "dep:gstreamer-app", "dep:base64"]

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = { version = "0.22", optional = true }
gstreamer = { version = "0.23", optional = true }
gstreamer-app = { version = "0.23", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
