name: verify

on:
  workflow_call:

jobs:
  verify-rust:
    name: verify (rust / desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: format
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: check mobile target
        run: cargo check --target aarch64-linux-android

      - name: check example app (desktop)
        working-directory: examples/tauri-app/src-tauri
        run: cargo check

  verify-js:
    name: verify (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: install
        run: npm ci

      - name: test
        run: npm test

      - name: build
        run: npm run build

  verify-android:
    name: verify (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125"
          yes | sdkmanager --licenses > /dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: install example dependencies
        working-directory: examples/tauri-app
        run: npm install

      - name: generate Android project
        working-directory: examples/tauri-app
        run: npm run tauri android init

      - name: setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: run Kotlin unit tests
        working-directory: examples/tauri-app/src-tauri/gen/android
        run: ./gradlew test

      - name: compile Android (debug)
        working-directory: examples/tauri-app/src-tauri/gen/android
        run: ./gradlew assembleDebug

  verify-ios:
    name: verify (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: install example dependencies
        working-directory: examples/tauri-app
        run: npm install

      - name: generate iOS project
        working-directory: examples/tauri-app
        run: npm run tauri ios init

      - name: run Swift tests on iOS Simulator
        working-directory: ios
        run: |
          xcodebuild test \
            -scheme tauri-plugin-camera-kessdev \
            -destination 'platform=iOS Simulator,name=iPhone 15'
